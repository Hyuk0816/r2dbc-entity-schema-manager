name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run library tests and publish to Maven Local
        run: ./gradlew clean test publishToMavenLocal

      - name: Run sample smoke test
        run: ./gradlew -p samples/mariadb-smoke-app clean test
